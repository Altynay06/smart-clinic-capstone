<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${role}+' | Smart Clinic'">Smart Clinic</title><link rel="stylesheet" href="/clinic.css"></head><body th:attr="data-role=${role}"><header><a href="/">Smart Clinic</a><span id="identity"></span><button id="logout" hidden>Logout</button></header><main><h1 th:text="${#strings.capitalize(role)}+' portal'">Portal</h1><p id="message" role="status"></p><section id="loginPanel" class="panel"><h2>Login</h2><form id="loginForm"><label th:text="${role=='admin'?'Username':'Email'}">Email</label><input name="identifier" required autocomplete="username"><label>Password<input name="password" required type="password" autocomplete="current-password"></label><button>Login</button></form><button id="showSignup" th:if="${role=='patient'}">Create patient account</button></section><section id="signupPanel" class="panel" hidden><h2>Patient registration</h2><form id="signupForm"><label>Full name<input name="name" required minlength="3"></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required minlength="8"></label><label>Phone (10 digits)<input name="phone" required pattern="[0-9]{10}"></label><label>Address<input name="address" required></label><button>Register</button></form></section><section id="dashboard" hidden><section id="adminPanel" hidden><h2>Add a doctor</h2><form id="doctorForm" class="grid"><label>Name<input name="name" minlength="3" required></label><label>Specialty<input name="specialty" minlength="3" required></label><label>Email<input name="email" type="email" required></label><label>Initial password<input name="password" type="password" minlength="8" required></label><label>Phone<input name="phone" pattern="[0-9]{10}" required></label><label>Hourly availability<input name="availableTimes" value="09:00-10:00,10:00-11:00,14:00-15:00" required></label><button>Add doctor</button></form></section><section id="directory" hidden><h2>Find a doctor</h2><form id="searchForm" class="filters"><label>Name<input name="name" placeholder="Search by name"></label><label>Specialty<input name="specialty" placeholder="Any specialty"></label><label>Time<select name="time"><option value="">Any time</option><option>AM</option><option>PM</option></select></label><button>Search</button></form><div id="doctors" class="cards"></div></section><section id="booking" class="panel" hidden><h2>Book an appointment</h2><p id="chosenDoctor"></p><form id="bookingForm"><input name="doctorId" type="hidden"><label>Date and time<input name="appointmentTime" type="datetime-local" step="3600" required></label><button>Book appointment</button></form></section><section id="appointmentsPanel"><h2>Appointments</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date and time</th><th>Status</th><th>Action</th></tr></thead><tbody id="appointments"></tbody></table></div></section><section id="prescriptionPanel" class="panel" hidden><h2>Add prescription</h2><form id="prescriptionForm"><label>Appointment ID<input name="appointmentId" type="number" readonly required></label><label>Medication<input name="medication" required></label><label>Dosage<input name="dosage" required></label><label>Duration<input name="duration" required></label><label>Notes<textarea name="notes"></textarea></label><button>Save prescription</button></form></section></section><p class="notice">Educational demonstration · Synthetic patient records only</p></main><script type="module" src="/clinic.js"></script></body></html>
