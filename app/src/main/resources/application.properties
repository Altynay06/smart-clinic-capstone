spring.application.name=smart-clinic
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cms}
spring.datasource.username=${DB_USER:clinic}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/clinic_prescriptions}
jwt.secret=${JWT_SECRET:}
spring.thymeleaf.cache=true
server.error.include-message=always
app.seed=${APP_SEED:false}
app.demo-password=${DEMO_PASSWORD:}

